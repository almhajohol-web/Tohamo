<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>A Thousand Words For Mohamed ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx"></canvas>

<section id="intro">
  <div id="spark"></div>
  <div id="introWrap">
    <div class="scene">
      <div id="env">
        <div class="paperin"><span>إلى محمد...</span></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
    </div>
    <h1 class="to">إلى محمد...</h1>
    <p class="sub">في كلام كتير جوايا، ودي طريقتي عشان أوصلهولك.</p>
    <button id="openBtn" class="btn gold">افتح رسالتك يا محمد</button>
  </div>
</section>

<main id="app" hidden>
  <header>
    <div class="bar"><i id="barFill"></i></div>
    <div class="top">
      <span id="count">1 / 15</span>
      <span class="brand">A Thousand Words For Mohamed</span>
      <span class="tools">
        <button id="mute" aria-label="الموسيقى">♪</button>
        <button id="restart" aria-label="ابدأ من الأول">↺</button>
      </span>
    </div>
  </header>
  <div id="stage"></div>
  <footer>
    <button id="prev" class="btn ghost">السابق</button>
    <button id="next" class="btn gold">التالي</button>
  </footer>
</main>

<div id="toast"></div>
<script src="main.js"></script>
</body>
</html>
